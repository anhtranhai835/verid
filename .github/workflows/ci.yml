# Every test of the repo, on Windows: verid's main platform, and the one the recorded hook
# payloads in test/e2e/hook.e2e.test.ts come from.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, format and all tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # Byte-exact checkout: the runner's default CRLF conversion would change hashed and
      # size-budgeted files.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx prettier --check .
      # Build, then unit, end-to-end and installer tests (install.ps1 and install.sh via Git Bash).
      - run: npm run test:full
