# Lite (bug fixes, UI tweaks, small changes in existing code). Prefer generating it:
#   verid cook --provider antigravity --mode remix
# Copy to .verid/manifest.yaml, then run verid cook and verid stock in your own terminal.
# - The TDD gate stays (RAW -> COOKING -> PLATED, evidence from verid taste).
# - No research, spec, design, plan, order, serve or review: remix has no modules.
# - The main agent is the single writer: no subagent per AC.
schemaVersion: 1
mode: remix
providers: ["antigravity"]
architecture: none
repos:
  - path: "."
    source_globs: ["src/**"]
    test_globs: ["**/test/**", "**/tests/**", "**/__tests__/**", "**/*.test.*", "**/*.spec.*"]
    e2e_globs: ["**/e2e/**", "**/*.e2e.*"]
