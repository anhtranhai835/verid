# Strict (auth, payments, critical systems). Prefer generating it:
#   verid cook --provider antigravity --mode prep
# Copy to .verid/manifest.yaml, then run verid cook in your own terminal.
# - Everything in standard, plus a read-only verid-security review before verid serve.
schemaVersion: 1
mode: prep
providers: ["antigravity"]
architecture: ddd
roles:
  reviewer: ["verid-reviewer"]
  security: ["verid-security"]
repos:
  - path: "."
    source_globs: ["src/**"]
    test_globs: ["**/test/**", "**/tests/**", "**/__tests__/**", "**/*.test.*", "**/*.spec.*"]
    e2e_globs: ["**/e2e/**", "**/*.e2e.*"]
