# Standard (new modules and medium features). Prefer generating it:
#   verid cook --provider antigravity --mode prep
# Copy to .verid/manifest.yaml, then run verid cook in your own terminal.
# - Research, spec, design and plan, then verid order for each module.
# - The main agent is the single writer under the TDD gate: no tester/coder subagent per AC.
# - One read-only verid-reviewer subagent before verid serve.
schemaVersion: 1
mode: prep
providers: ["antigravity"]
architecture: ddd
roles:
  reviewer: ["verid-reviewer"]
repos:
  - path: "."
    source_globs: ["src/**"]
    test_globs: ["**/test/**", "**/tests/**", "**/__tests__/**", "**/*.test.*", "**/*.spec.*"]
    e2e_globs: ["**/e2e/**", "**/*.e2e.*"]
