# Preset 2: Standard Antigravity Mode (Recommended for Medium Features & New Modules)
# - Full EARS traceability (`spec.md` -> `design.md` -> `plan.md` -> `AC-n` JUnit tests)
# - Single-writer TDD on `main` (no split tester/coder subagents per AC — saves ~70% tokens)
# - Independent read-only review via `verid-reviewer` subagent before `verid serve`
version: 1
mode: strict
drive: human
workflow: classic
resources: plugin
roles:
  reviewer:
    - verid:reviewer
repos:
  - name: app
    path: .
    role: fullstack
    test_cmd: npx vitest run --reporter=default --reporter=junit --outputFile=.verid/.state/junit.xml
    junit_path: .verid/.state/junit.xml
    source_globs:
      - "src/**"
    test_globs:
      - "test/**"
      - "tests/**"
      - "**/*.test.*"
      - "**/*.spec.*"
    e2e_globs:
      - "e2e/**"
      - "**/*.e2e.*"
